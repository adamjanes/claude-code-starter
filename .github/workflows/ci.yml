name: CI

# This workflow is the gate. `pnpm gate` pushes a lane's working tree to gate/<lane> and waits on the run here, so
# "the full test suite" means exactly one thing, agents and humans alike. Vercel skips gate/** (scripts/vercel-ignore.sh).
on:
  push:
    branches: [main, 'gate/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same gate or PR branch cancels the older run; main always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # A PR whose merged tree already passed on a gate branch reuses that verdict instead of running it twice.
  reuse:
    name: Reuse a green gate run
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      reused: ${{ steps.find.outputs.reused }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('node:child_process')
            const tree = execSync('git rev-parse HEAD^{tree}').toString().trim()
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'ci.yml', event: 'push', status: 'success', per_page: 50,
            })
            for (const run of data.workflow_runs) {
              if (!run.head_branch?.startsWith('gate/')) continue
              const { data: commit } = await github.rest.git.getCommit({ ...context.repo, commit_sha: run.head_sha })
              if (commit.tree.sha === tree) {
                core.notice(`This exact tree passed the gate: ${run.html_url}`)
                core.setOutput('reused', 'true')
                return
              }
            }
            core.setOutput('reused', 'false')

  gate:
    name: Lint, typecheck, test & build
    needs: reuse
    # !cancelled() lets this run when `reuse` was skipped (every push); a reused PR skips it, which counts as passing.
    if: ${{ !cancelled() && needs.reuse.outputs.reused != 'true' }}
    # To run on your own machine: runs-on: [self-hosted, <label>], and keep a fork guard on the job (docs/github-actions.md).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
