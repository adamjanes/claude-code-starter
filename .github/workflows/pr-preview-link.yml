name: PR preview link

# Pins the PR's Vercel preview URL as the first line of its description, so the review surface is one click away.
# The URL comes from the Vercel bot comment's `[vc]:` header, never rebuilt from the branch name (long names get hashed).
# Not on Vercel? Delete this file; the rest of the setup does not depend on it.
on:
  # Vercel's first comment already carries the preview URL; its later edits only change the deploy status.
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write

jobs:
  pin:
    name: Pin the preview URL in the PR description
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event.issue.pull_request && github.event.comment.user.login == 'vercel[bot]')
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        env:
          # Optional repo variable: which Vercel project's preview to pin when one repo deploys several.
          VERCEL_PROJECT: ${{ vars.VERCEL_PROJECT }}
        with:
          script: |
            const pr = { ...context.repo, pull_number: context.issue.number }
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            })
            const header = comments
              .filter((c) => c.user?.login === 'vercel[bot]')
              .flatMap((c) => (c.body ?? '').split(/\r?\n/))
              .filter((line) => line.startsWith('[vc]: #'))
              .pop()
            if (!header) return core.info('No Vercel comment yet.')

            let host
            try {
              const data = JSON.parse(Buffer.from(header.slice(header.lastIndexOf(':') + 1).trim(), 'base64').toString('utf8'))
              const wanted = process.env.VERCEL_PROJECT
              host = (wanted ? data.projects?.find((p) => p.name === wanted) : data.projects?.[0])?.previewUrl
            } catch {
              host = undefined
            }
            if (typeof host !== 'string' || !/^[a-z0-9.-]+\.vercel\.app$/.test(host)) return core.info('No preview URL yet.')

            // The event's copy of the body can be stale after an edit, so read the live one.
            const { data: live } = await github.rest.pulls.get(pr)
            const body = (live.body ?? '').replace(/\r\n/g, '\n')
            const block = `<!-- pr-preview-link -->\n**Preview:** https://${host}\n<!-- /pr-preview-link -->`
            const existing = /<!-- pr-preview-link -->[\s\S]*?<!-- \/pr-preview-link -->/
            const next = existing.test(body) ? body.replace(existing, () => block) : `${block}\n\n${body}`.trim()
            if (next === body) return core.info('Preview line already current.')
            await github.rest.pulls.update({ ...pr, body: next })
            core.info(`Pinned https://${host}`)
